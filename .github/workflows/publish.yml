name: Publish Docker images

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: privacyx-org
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF##*/}"
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "extra_tags="     >> $GITHUB_OUTPUT
          else
            echo "version=edge"    >> $GITHUB_OUTPUT
            echo "extra_tags="     >> $GITHUB_OUTPUT
          fi
          echo "ref=${GITHUB_REF}"

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-gateway:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-gateway:latest

      - name: Build & push scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-scheduler:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-scheduler:latest

      - name: Build & push miner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.miner
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-miner:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/px-miner:latest

